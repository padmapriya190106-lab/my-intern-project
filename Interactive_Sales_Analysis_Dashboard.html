<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Analysis Dashboard — Interactive</title>
<style>
:root{--navy:#123b78;--blue:#285b98;--pink:#e94b78;--coral:#ff777b;--purple:#8e438c;--gold:#f4a900;--ink:#102f66;--panel:#edf5ff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(115deg,#073c83,#8a397d 48%,#ff8a83);color:var(--ink);padding:16px}
.dashboard{max-width:1600px;margin:auto;min-height:calc(100vh - 32px);border:5px solid #173d78;border-radius:12px;padding:12px;background:linear-gradient(125deg,#183d7c 0%,#a33f83 50%,#ff8d82 100%);box-shadow:0 8px 24px #071d4d88}
header{height:62px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;text-shadow:2px 3px 3px #46214c;font-size:clamp(22px,3vw,42px);font-weight:800;font-style:italic;letter-spacing:.5px}
.brand{position:absolute;left:8px;font-size:clamp(13px,1.7vw,25px);color:#ffd0a1}
.actions{position:absolute;right:4px;top:8px}.clear{border:1px solid #fff;border-radius:18px;padding:8px 13px;background:#fff;color:#17427f;font-weight:700;cursor:pointer}.clear:hover{background:#ffe8ef}
.layout{display:grid;grid-template-columns: minmax(190px, .95fr) minmax(420px,2.35fr) minmax(340px,1.65fr);gap:12px;min-height:calc(100vh - 130px)}
.kpis{display:grid;grid-template-rows:repeat(5,1fr);gap:12px}
.kpi,.panel{background:linear-gradient(145deg,#f8fbff,#dceaff);border:3px solid #234f8d;border-radius:12px;box-shadow:inset 0 2px 10px #7da5d6aa,0 3px 6px #102d5c66;overflow:hidden}
.kpi{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;min-height:95px;cursor:default}
.kpi .label{font-size:clamp(12px,1.1vw,17px);font-weight:800;text-align:right}.kpi .value{font-size:clamp(22px,2.3vw,36px);font-weight:800;color:#d41463;text-align:right;margin-top:12px}
.kpi .ico{font-size:clamp(32px,4vw,58px);filter:drop-shadow(1px 2px 1px #8aa4c8)}
.middle{display:grid;grid-template-rows:1.08fr 1fr;gap:12px;min-height:0}
.right{display:grid;grid-template-rows:1fr .9fr .95fr;gap:12px;min-height:0}
.panel{padding:10px 12px;min-height:0;display:flex;flex-direction:column}
.panel h3{margin:0 0 8px;text-align:center;font-size:clamp(13px,1.15vw,18px);color:#123b78}
.tabs{display:flex;gap:5px;margin:-2px -2px 7px}.tab{flex:1;border:0;border-radius:8px 8px 0 0;padding:9px 5px;background:#c7def7;color:#123b78;font-weight:800;cursor:pointer}.tab.active{background:#ffe2d8}
.chart{flex:1;min-height:100px;position:relative;overflow:auto}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
svg{width:100%;height:100%;min-height:120px;overflow:visible}
.bar{cursor:pointer}.bar:hover{opacity:.75;filter:brightness(1.08)}.selected{stroke:#092b66;stroke-width:3}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;margin:0 0 4px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.hint{font-size:11px;text-align:center;color:#526c91;margin-top:4px}
.empty{display:grid;place-items:center;height:100%;color:#637da0;font-size:13px}
@media(max-width:1000px){.layout{grid-template-columns:180px 1fr}.right{grid-column:2;grid-template-columns:1fr 1fr;grid-template-rows:230px 230px}.right .panel:last-child{grid-column:1/-1}.middle{grid-column:2}.kpis{grid-row:1 / span 2}}
@media(max-width:650px){body{padding:5px}.dashboard{padding:7px}.layout{display:flex;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.kpi{min-height:90px}.middle{grid-template-rows:300px 500px}.bottom{grid-template-columns:1fr}.right{display:flex;flex-direction:column}.right .panel{height:260px}header{height:78px;padding-top:20px}.brand{top:2px}.actions{top:2px}}
</style></head><body>

const filters={};let activeTab='month';
const colors=['#285b98','#91458c','#e94b78','#f4a900','#557fb6','#cf6b80'];
const money=n=>{let a=Math.abs(n);return (a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0));};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(except){return DATA.filter(d=>Object.entries(filters).every(([k,v])=>k===except||d[k]===v));}
function setFilter(k,v){if(filters[k]===v)delete filters[k];else filters[k]=v;render();}
function clearAll(){Object.keys(filters).forEach(k=>delete filters[k]);render();}
function agg(rows,key){let m=new Map();rows.forEach(d=>m.set(d[key],(m.get(d[key])||0)+d.sales));return [...m].sort((a,b)=>b[1]-a[1]);}
function sum(rows,k){return rows.reduce((a,d)=>a+(+d[k]||0),0)}
function unique(rows,k){return new Set(rows.map(d=>d[k])).size}
function svgWrap(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`}
function text(x,y,s,size=12,anchor='start',fill='#123b78',weight='normal'){return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${fill}" font-weight="${weight}">${esc(s)}</text>`}
function barChart(el,rows,key,title,limit=5){let a=agg(rows,key).slice(0,limit);if(!a.length){el.innerHTML='<div class="empty">No data for this selection</div>';return}
let w=500,h=Math.max(160,a.length*43+35),max=Math.max(...a.map(x=>x[1]))||1,inner='';
a.forEach(([name,val],i)=>{let y=14+i*43,bw=val/max*260,active=filters[key]===name;inner+=text(5,y+19,name.length>22?name.slice(0,21)+'…':name,12,'start');inner+=`<rect class="bar ${active?'selected':''}" data-key="${key}" data-val="${esc(name)}" x="155" y="${y}" width="${Math.max(2,bw)}" height="27" rx="2" fill="${colors[i%colors.length]}"/>`;inner+=text(163+bw,y+18,money(val),12,'start','#123b78','bold');});
el.innerHTML=svgWrap(w,h,inner);wire(el);}
function mainChart(){let el=document.getElementById('mainChart'),rows=filtered();if(activeTab==='month'){let a=[...new Map(rows.map(d=>[d.monthSort,d.month])).entries()].sort((x,y)=>x[0].localeCompare(y[0])).map(([sort,label])=>[label,rows.filter(d=>d.monthSort===sort).reduce((s,d)=>s+d.sales,0)]);drawMain(el,a,'month',true);}
else {let key=activeTab==='category'?'category':'segment';drawMain(el,agg(rows,key),key,false);}}
function drawMain(el,a,key,isMonth){if(!a.length){el.innerHTML='<div class="empty">No data for this selection</div>';return}let w=650,h=Math.max(190,a.length*46+30),max=Math.max(...a.map(x=>x[1]))||1,inner='';
a.forEach(([name,val],i)=>{let y=12+i*46,bw=val/max*410;inner+=text(5,y+21,name,13,'start');inner+=`<rect class="bar ${filters[key]===name?'selected':''}" data-key="${key}" data-val="${esc(name)}" x="135" y="${y}" width="${Math.max(2,bw)}" height="30" rx="2" fill="${colors[i%colors.length]}"/>`;inner+=text(143+bw,y+20,money(val),13,'start','#123b78','bold')});el.innerHTML=svgWrap(w,h,inner);wire(el);}
function cityChart(){let el=document.getElementById('cities'),rows=filtered(),a=agg(rows,'city').slice(0,5);if(!a.length){el.innerHTML='<div class="empty">No data</div>';return}let w=480,h=220,max=Math.max(...a.map(x=>x[1]))||1,inner='';a.forEach(([city],i)=>{let group=rows.filter(d=>d.city===city),s=sum(group,'sales'),p=sum(group,'profit'),y=8+i*40;inner+=text(2,y+22,city,11,'start');inner+=`<rect class="bar" data-key="city" data-val="${esc(city)}" x="115" y="${y}" width="${s/max*250}" height="15" fill="#f4a900"/>`;inner+=`<rect class="bar" data-key="city" data-val="${esc(city)}" x="115" y="${y+17}" width="${Math.max(1,p/max*250)}" height="13" fill="#285b98"/>`;inner+=text(120+s/max*250,y+12,money(s),10);});el.innerHTML=svgWrap(w,h,inner);wire(el);}
function trendChart(){let el=document.getElementById('trend'),rows=filtered(),months=[...new Map(rows.map(d=>[d.monthSort,d.month])).entries()].sort((a,b)=>a[0].localeCompare(b[0]));if(!months.length){el.innerHTML='<div class="empty">No data</div>';return}let w=480,h=190,vals=months.map(([sort,label])=>{let r=rows.filter(d=>d.monthSort===sort);return {label,sort,s:sum(r,'sales'),p:sum(r,'profit')}}),max=Math.max(...vals.map(v=>v.s))||1,inner='';let pts=(k)=>vals.map((v,i)=>`${30+i*(420/Math.max(1,vals.length-1))},${145-v[k]/max*115}`).join(' ');inner+=`<polyline points="${pts('s')}" fill="none" stroke="#3979e8" stroke-width="3"/>`;inner+=`<polyline points="${pts('p')}" fill="none" stroke="#16844e" stroke-width="3"/>`;vals.forEach((v,i)=>{let x=30+i*(420/Math.max(1,vals.length-1)),ys=145-v.s/max*115,yp=145-v.p/max*115;inner+=`<circle class="bar" data-key="month" data-val="${esc(v.label)}" cx="${x}" cy="${ys}" r="5" fill="#3979e8"/>`;inner+=`<circle class="bar" data-key="month" data-val="${esc(v.label)}" cx="${x}" cy="${yp}" r="4" fill="#16844e"/>`;inner+=text(x,174,v.label.split(' ')[0],10,'middle');});el.innerHTML=svgWrap(w,h,inner);wire(el);}
function segmentChart(){let el=document.getElementById('segments'),rows=filtered(),a=[...new Set(rows.map(d=>d.segment))].map(s=>[s,sum(rows.filter(d=>d.segment===s),'profit')]);let total=a.reduce((s,x)=>s+x[1],0);if(!a.length||!total){el.innerHTML='<div class="empty">No data</div>';return}let cx=150,cy=105,r=68,ri=39,angle=-Math.PI/2,inner='';a.forEach(([name,val],i)=>{let end=angle+val/total*Math.PI*2,x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end),large=end-angle>Math.PI?1:0;inner+=`<path class="bar" data-key="segment" data-val="${esc(name)}" d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z M ${cx+ri*Math.cos(end)} ${cy+ri*Math.sin(end)} A ${ri} ${ri} 0 ${large} 0 ${cx+ri*Math.cos(angle)} ${cy+ri*Math.sin(angle)} Z" fill="${colors[i%colors.length]}" fill-rule="evenodd"/>`;let mid=(angle+end)/2;inner+=text(cx+105*Math.cos(mid),cy+105*Math.sin(mid),((val/total)*100).toFixed(1)+'%',11,'middle');angle=end;});a.forEach(([name],i)=>{inner+=`<rect x="290" y="${40+i*30}" width="12" height="12" fill="${colors[i%colors.length]}"/>`;inner+=text(309,51+i*30,name,12)});el.innerHTML=svgWrap(430,220,inner);wire(el);}
function kpis(){let r=filtered(),cards=[['👤','Total Customers',unique(r,'customer')],['🛒','Total Orders',unique(r,'order')],['📦','Total Quantity',sum(r,'qty')],['💰','Total Sales',money(sum(r,'sales'))],['🤝','Total Profit',money(sum(r,'profit'))]];document.getElementById('kpis').innerHTML=cards.map(([ico,label,val])=>`<div class="kpi"><div class="ico">${ico}</div><div><div class="label">${label}</div><div class="value">${typeof val==='number'?val.toLocaleString('en-IN'):val}</div></div></div>`).join('');}
function wire(el){el.querySelectorAll('[data-key]').forEach(node=>node.addEventListener('click',()=>setFilter(node.dataset.key,node.dataset.val)));}
function render(){kpis();mainChart();barChart(document.getElementById('products'),filtered(),'product','',5);barChart(document.getElementById('customers'),filtered(),'customer','',5);cityChart();trendChart();segmentChart();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;mainChart();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));}));
render();
</script></body></html>
